<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ORbit Vision</title>
<style>
  :root { --panel: rgba(18,22,28,.82); --line: rgba(255,255,255,.18); --text:#f2f4f7; --muted:#b7c0cb; --accent:#3aa0ff; --warn:#ffc53d; --bad:#ff5a4f; --ok:#4cd184; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#dfe3e7; overflow:hidden; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; z-index:0; }
  #overlay { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #overlay > * { pointer-events:auto; }
  .top { position:absolute; left:10px; right:10px; top:10px; }
  .status { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13.5px; }
  .status b { color:#fff; }
  .brand { font-weight:700; letter-spacing:.3px; margin-right:6px; }
  .modes { display:flex; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:2px; scrollbar-width:none; }
  .modes::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:8px 13px; font: inherit; font-size:13px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:8px 14px calc(12px + env(safe-area-inset-bottom)); max-height:40vh; overflow-y:auto; }
  .sheet.min .body { display:none; }
  .handle { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .handle button, .btn { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:8px 12px; font: inherit; font-size:13px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { margin:10px 0; }
  .row label { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:3px; }
  .row label span.v { color:var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width:100%; accent-color: var(--accent); height:26px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .report { font-size:13px; line-height:1.5; margin-top:6px; }
  .report .bad { color:var(--bad); } .report .warn { color:var(--warn); } .report .ok { color:var(--ok); }
  .legend { font-size:12px; color:var(--muted); margin-top:4px; }
  #ARButton { z-index:20 !important; position:fixed !important; bottom:auto !important; top:112px !important; left:50% !important; transform:translateX(-50%); padding:10px 18px !important; border-radius:999px !important; background:#1d6fb8 !important; border:0 !important; color:#fff !important; font: 600 14px system-ui, sans-serif !important; opacity:1 !important; width:auto !important; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="overlay">
  <div class="top">
    <div class="status"><span class="brand">ORbit Vision</span><span id="status">Loading models…</span></div>
    <div class="modes" id="modes">
      <button class="chip on" data-mode="place">Place system</button>
      <button class="chip" data-mode="table">Mark table</button>
      <button class="chip" data-mode="wall">Mark wall</button>
      <button class="chip" data-mode="mvs">Move MVS</button>
      <button class="chip" data-mode="monitor">Move StandUI</button>
    </div>
  </div>
  <div class="sheet" id="sheet">
    <div class="handle">
      <strong>Controls</strong>
      <div style="display:flex; gap:6px;">
        <button class="btn primary" id="fit">Fit check</button>
        <button id="toggle">Hide</button>
      </div>
    </div>
    <div class="body">
      <div class="report" id="report"><span class="legend">Mark the table and walls, then run the fit check.</span></div>
      <div id="joints"></div>
      <div class="btns">
        <button class="btn" data-pose="park">Park</button>
        <button class="btn" data-pose="ap">AP</button>
        <button class="btn" data-pose="lat">Lateral</button>
        <button class="btn" id="clearObs">Clear marks</button>
      </div>
      <div class="row"><label><span>Rotate system</span><span class="v" id="rotV">0°</span></label><input type="range" id="rot" min="-180" max="180" step="1" value="0"></div>
      <div class="legend">Yellow = within 10 cm · red = contact. Ranges marked E are estimates.</div>
    </div>
  </div>
</div>

};

{ const m = new THREE.MeshStandardMaterial({ color: 0x5b636b, roughness: 0.6 });

// the system (C-arm + MVS + StandUI monitor) lives in one group placed on the floor
const system = new THREE.Group(); scene.add(system);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.28 }));

reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

// ---------------- load models ----------------
const loader = new GLTFLoader();
const EMBED = window.__GLB__;

const loadGLB = url => new Promise((res, rej) => { const key = url.split('/').pop(); if (EMBED && EMBED[key]) loader.parse(b64(EMBED[key]), '', g => res(g.scene), rej); else loader.load(url, g => res(g.scene), undefined, rej); });

} catch (e) { setStatus('<b>Could not load models.</b> Open this page from a web server (not as a file).'); throw e; }

function screenTex(label, sub, bg, w = 640, h = 380) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace;
  return { c, t, label, sub, bg };
}
const screens = {
  StandUI_Screen: screenTex('StandUI', 'Live StandUI stream goes here', '#12324f'),
  MVS_Screen_Left: screenTex('MVS', 'Live MVS stream goes here', '#1b2430'),
  MVS_Screen_Right: screenTex('MVS', 'Reference image', '#1b2430'),
};
function drawScreens(t) {
  for (const s of Object.values(screens)) {
    const g = s.c.getContext('2d'), W = s.c.width, H = s.c.height;

    g.fillStyle = '#a9c4e0'; g.font = `${H * .06}px Arial`; g.fillText(s.sub, W * .05, H * .23);
    const r = H * .26, cx = W * .5, cy = H * .6, gr = g.createRadialGradient(cx, cy, r * .1, cx, cy, r);
    gr.addColorStop(0, '#ddd'); gr.addColorStop(1, '#151515'); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.fillStyle = '#7bd389'; g.font = `${H * .055}px Arial`; g.fillText(new Date().toLocaleTimeString(), W * .05, H * .94);
    s.t.needsUpdate = true;
  }
}
for (const obj of [mvs, tsm]) obj.traverse(o => { if (o.isMesh && screens[o.name]) o.material = new THREE.MeshBasicMaterial({ map: screens[o.name].t, toneMapped: false }); });

// ---------------- joints ----------------
const base = {}, state = { Lift: 0.05, WigWag: 0, Horizontal: 0.05, Angulation: 0, Orbital: 0 };
for (const [k, j] of Object.entries(JOINTS)) { const n = carm.getObjectByName(j.node); base[k] = { n, p: n.position.clone(), q: n.quaternion.clone() }; }
function applyJoints() {
  for (const [k, j] of Object.entries(JOINTS)) {
    const b = base[k], ax = new THREE.Vector3(...j.axis);
    if (j.type === 'translate') b.n.position.copy(b.p).addScaledVector(ax, state[k]);

}
const sliders = {};

}
applyJoints();
const POSES = { park: { Lift: 0, WigWag: 0, Horizontal: 0, Angulation: 0, Orbital: 0 }, ap: { Lift: 0.05, WigWag: 0, Horizontal: 0.05, Angulation: 0, Orbital: 0 }, lat: { Lift: 0.05, WigWag: 0, Horizontal: 0.05, Angulation: 90, Orbital: 0 } };
document.querySelectorAll('[data-pose]').forEach(b => b.onclick = () => {
  for (const [k, v] of Object.entries(POSES[b.dataset.pose])) { sliders[k].value = v; sliders[k].dispatchEvent(new Event('input')); }
});
$('rot').addEventListener('input', e => { system.rotation.y = baseYaw + THREE.MathUtils.degToRad(+e.target.value); $('rotV').textContent = `${e.target.value}°`; liveCheck(); });

// ---------------- collision sampling ----------------
const samples = new Map();   // mesh -> Float32Array of local points
{ const p = new THREE.Vector3();
  for (const m of carmMeshes) {
    const tmp = new THREE.Mesh(m.geometry.index ? m.geometry.toNonIndexed() : m.geometry);
    const s = new MeshSurfaceSampler(tmp).build(), N = 260, arr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { s.sample(p); arr.set([p.x, p.y, p.z], i * 3); }
    samples.set(m, arr);
  } }
const _w = new THREE.Vector3(), _l = new THREE.Vector3();
function evaluate() {       // returns {level: 0 ok / 1 warn / 2 hit, per mesh, obstacle names}
  system.updateMatrixWorld(true);
  const res = { level: 0, meshes: new Map(), hitBy: new Set(), warnBy: new Set() };
  for (const [m, arr] of samples) {
    let lvl = 0;
    for (let i = 0; i < arr.length && lvl < 2; i += 3) {
      _w.set(arr[i], arr[i + 1], arr[i + 2]).applyMatrix4(m.matrixWorld);
      for (const ob of obstacles) {
        _l.copy(_w).applyMatrix4(ob.inv);
        const dx = Math.abs(_l.x) - ob.half.x, dy = Math.abs(_l.y) - ob.half.y, dz = Math.abs(_l.z) - ob.half.z;
        if (dx <= 0 && dy <= 0 && dz <= 0) { lvl = 2; res.hitBy.add(ob.name); break; }
        if (dx <= WARN_MARGIN && dy <= WARN_MARGIN && dz <= WARN_MARGIN && lvl < 1) { lvl = 1; res.warnBy.add(ob.name); }
      }
    }
    res.meshes.set(m, lvl); res.level = Math.max(res.level, lvl);
  }
  return res;
}
function tint(res) {
  for (const m of carmMeshes) {
    const l = res ? res.meshes.get(m) : 0;
    m.material.emissive = new THREE.Color(l === 2 ? 0xff2a1f : l === 1 ? 0xffb300 : 0x000000);
    m.material.emissiveIntensity = l ? 0.7 : 0;
  }
}
function liveCheck() { if (obstacles.length) tint(evaluate()); else tint(null); }

// sweep one joint from its current value towards both ends; find the free range
function sweep(k) {
  const j = JOINTS[k], saved = state[k], isT = j.type === 'translate', step = isT ? 0.01 : 2;
  const out = { k, isT, lo: saved, hi: saved, hiBy: null, loBy: null, warn: new Set() };
  for (const dir of [1, -1]) {
    const end = dir > 0 ? j.max : j.min, vals = [];
    for (let v = saved; dir > 0 ? v < end : v > end; v += dir * step) vals.push(v);
    vals.push(end);
    for (const v of vals) {
      state[k] = v; applyJoints(); const r = evaluate();
      r.warnBy.forEach(n => out.warn.add(n));
      if (r.level === 2) { if (dir > 0) out.hiBy = [...r.hitBy][0]; else out.loBy = [...r.hitBy][0]; break; }
      if (dir > 0) out.hi = v; else out.lo = v;
    }
  }
  state[k] = saved; applyJoints();
  return out;
}
const fmtV = (v, isT) => isT ? `${Math.round(v * 100)} cm` : `${Math.round(v)}°`;
$('fit').onclick = () => {
  if (!obstacles.length) { $('report').innerHTML = '<span class="warn">Mark the table and at least one wall first.</span>'; return; }
  const now = evaluate(), lines = [];
  lines.push(now.level === 2 ? `<div class="bad">● Current position touches: ${[...now.hitBy].join(', ')}</div>`
    : now.level === 1 ? `<div class="warn">● Current position is within 10 cm of: ${[...now.warnBy].join(', ')}</div>`
    : `<div class="ok">● Current position is clear</div>`);
  for (const k of Object.keys(JOINTS)) {
    const s = sweep(k), j = JOINTS[k];
    const full = Math.abs(s.lo - j.min) < 1e-3 && Math.abs(s.hi - j.max) < 1e-3;
    if (full && !s.warn.size) lines.push(`<div class="ok">${k}: full range free</div>`);
    else if (full) lines.push(`<div class="warn">${k}: full range, but close to ${[...s.warn].join(', ')}</div>`);
    else lines.push(`<div class="bad">${k}: free ${fmtV(s.lo, s.isT)} to ${fmtV(s.hi, s.isT)} of ${fmtV(j.min, s.isT)} to ${fmtV(j.max, s.isT)}${s.loBy ? ` · low end blocked by ${s.loBy}` : ''}${s.hiBy ? ` · high end blocked by ${s.hiBy}` : ''}</div>`);
  }
  $('report').innerHTML = lines.join('');
  tint(now);
};

// ---------------- obstacles ----------------
const obsMatTable = new THREE.MeshBasicMaterial({ color: 0x3aa0ff, transparent: true, opacity: 0.25, depthWrite: false });
const obsMatWall = new THREE.MeshBasicMaterial({ color: 0xb0b8c2, transparent: true, opacity: 0.22, depthWrite: false, side: THREE.DoubleSide });
function addObstacle(name, size, center, yaw, mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), mat);
  mesh.position.copy(center); mesh.rotation.y = yaw; obsGroup.add(mesh);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: mat.color })));
  mesh.updateMatrixWorld(true);
  obstacles.push({ name, mesh, half: size.clone().multiplyScalar(0.5), inv: mesh.matrixWorld.clone().invert() });
  liveCheck();
}
function obstacleFromTwoPoints(kind, p1, p2, viewerPos) {
  const d = new THREE.Vector3(p2.x - p1.x, 0, p2.z - p1.z); const L = d.length(); if (L < 0.15) return false;
  d.normalize();
  let n = new THREE.Vector3(-d.z, 0, d.x);
  const mid = p1.clone().add(p2).multiplyScalar(0.5);
  if (n.dot(new THREE.Vector3(mid.x - viewerPos.x, 0, mid.z - viewerPos.z)) < 0) n.negate();   // extend away from the viewer
  const yaw = Math.atan2(-d.z, d.x);
  if (kind === 'table') {
    const c = mid.clone().addScaledVector(n, TABLE_WIDTH / 2); c.y = (p1.y + p2.y) / 2 - TABLE_SLAB / 2;
    addObstacle(`Table ${obstacles.filter(o => o.name.startsWith('Table')).length + 1}`, new THREE.Vector3(L, TABLE_SLAB, TABLE_WIDTH), c, yaw, obsMatTable);
  } else {
    const c = mid.clone().addScaledVector(n, WALL_THICK / 2); c.y = floorY + WALL_HEIGHT / 2;
    addObstacle(`Wall ${obstacles.filter(o => o.name.startsWith('Wall')).length + 1}`, new THREE.Vector3(L, WALL_HEIGHT, WALL_THICK), c, yaw, obsMatWall);
  }
  return true;
}
$('clearObs').onclick = () => { obstacles.length = 0; obsGroup.clear(); markDots.clear(); pending = null; liveCheck(); $('report').innerHTML = '<span class="legend">Marks cleared.</span>'; };

// ---------------- modes ----------------
let mode = 'place', pending = null, floorY = 0, baseYaw = 0, placed = false;
const HINT = {
  place: 'Point at the floor where the C-arm should stand, then tap.',
  table: 'Tap two points along the near long edge of the real table top.',
  wall: 'Tap two points on the floor where a wall meets it.',
  mvs: 'Tap the floor where the MVS cart should stand.',
  monitor: 'Tap the table edge where the StandUI monitor clamps.',
};
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; pending = null; markDots.clear();
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  setStatus(inAR ? HINT[mode] : `${HINT[mode]} <b>(needs AR on the phone)</b>`);
});
$('toggle').onclick = () => { const s = $('sheet'); s.classList.toggle('min'); $('toggle').textContent = s.classList.contains('min') ? 'Show' : 'Hide'; };

// ---------------- AR session ----------------
let inAR = false, hitTestSource = null, hitReq = false;
const arBtn = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay', 'anchors'], domOverlay: { root: $('overlay') } });
document.body.appendChild(arBtn);
$('overlay').addEventListener('beforexrselect', e => e.preventDefault());   // taps on buttons must not place things

renderer.xr.addEventListener('sessionstart', () => {
  inAR = true; preview.visible = false; scene.background = null; shadowCatcher.visible = true;
  system.visible = false; placed = false; obstacles.length = 0; obsGroup.clear(); markDots.clear(); liveCheck();
  document.querySelector('[data-mode="place"]').click();
  $('sheet').classList.add('min'); $('toggle').textContent = 'Show';
  setStatus('Move the phone slowly over the floor until the blue ring appears, then tap.');
});
renderer.xr.addEventListener('sessionend', () => {
  inAR = false; preview.visible = true; system.visible = true; shadowCatcher.visible = false; reticle.visible = false;
  system.position.set(0, 0, 0); system.rotation.set(0, 0, 0); baseYaw = 0; hitTestSource = null; hitReq = false;
  obstacles.length = 0; obsGroup.clear(); markDots.clear(); addPreviewTable(); setStatus('3D preview. Tap "Start AR" on an Android phone to place it in your room.');
});

const controller = renderer.xr.getController(0); scene.add(controller);
controller.addEventListener('select', () => {
  if (!reticle.visible) { setStatus('No surface found yet. Move the phone slowly over the floor.'); return; }
  const p = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  const xrCam = renderer.xr.getCamera(); const camPos = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
  if (mode === 'place') {
    const fwd = new THREE.Vector3(); xrCam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    baseYaw = Math.atan2(-fwd.z, fwd.x);                // C-arm +X points away from the user
    system.position.copy(p); floorY = p.y; system.rotation.set(0, baseYaw + THREE.MathUtils.degToRad(+$('rot').value), 0);
    system.visible = true; placed = true; liveCheck();
    setStatus('Placed. Walk around it. Next: <b>Mark table</b> and <b>Mark wall</b>, then Fit check.');
    return;
  }
  if (!placed) { setStatus('Place the system first.'); return; }
  if (mode === 'mvs' || mode === 'monitor') {
    const obj = mode === 'mvs' ? mvs : tsm;
    const local = system.worldToLocal(p.clone()); obj.position.copy(local);
    const toCam = system.worldToLocal(camPos.clone()).sub(local); obj.rotation.set(0, Math.atan2(toCam.x, toCam.z), 0);   // screen (+Z) faces the user
    setStatus(mode === 'mvs' ? 'MVS placed.' : 'StandUI monitor placed.');
    return;
  }
  // table / wall need two taps
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffc53d })); dot.position.copy(p); markDots.add(dot);
  if (!pending) { pending = p; setStatus('Now tap the second point.'); return; }
  const ok = obstacleFromTwoPoints(mode, pending, p, camPos); pending = null; markDots.clear();
  setStatus(ok ? `${mode === 'table' ? 'Table' : 'Wall'} marked. Add more, or run the Fit check.` : 'Points too close. Try again.');
});

function addPreviewTable() {     // in preview the stand-in table is a ready-made obstacle
  standInTable.updateMatrixWorld(true);
  const top = standInTable.children[0]; const c = new THREE.Vector3(); top.getWorldPosition(c); c.y = 0.88 - TABLE_SLAB / 2;
  addObstacle('Table 1', new THREE.Vector3(0.52, TABLE_SLAB, 2.0), c, 0, obsMatTable);
  addObstacle('Wall 1', new THREE.Vector3(4, WALL_HEIGHT, WALL_THICK), new THREE.Vector3(isoLocal.x + 0.85, WALL_HEIGHT / 2, 0), Math.PI / 2, obsMatWall);
  obsGroup.children.forEach(m => m.visible = false);   // keep preview clean; obstacles still active
}
addPreviewTable();

// ---------------- loop ----------------
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let frameN = 0;
renderer.setAnimationLoop((t, frame) => {
  if (frameN++ % 10 === 0) drawScreens(t);
  if (frame && inAR) {
    const ref = renderer.xr.getReferenceSpace(), session = renderer.xr.getSession();
    if (!hitReq) {
      session.requestReferenceSpace('viewer').then(vs => session.requestHitTestSource({ space: vs }).then(s => hitTestSource = s));
      session.addEventListener('end', () => { hitReq = false; hitTestSource = null; }); hitReq = true;
    }
    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length) { reticle.visible = true; reticle.matrix.fromArray(hits[0].getPose(ref).transform.matrix); } else reticle.visible = false;
    }
  } else controls.update();
  renderer.render(scene, camera);
});
setStatus('3D preview. Tap "Start AR" on an Android phone to place it in your room.');
window.__READY__ = true;
</script>
</body>
